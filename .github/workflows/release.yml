name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the check and the builds; publish nothing'
        type: boolean
        default: true
      action_v1:
        description: "With dry_run off, on a release tag's ref: move the Action's v1 tag to that tag's commit (a yank's roll-back)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Gates the run: the tag names the version at its commit, the commit is on main, and main's CI
  # passed for it. A dispatch runs the same gates without the tag.
  check:
    name: tag, main and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$EVENT" = push ]; then
            if [ "v$version" != "$TAG" ]; then echo "tag $TAG does not match cobolwork $version"; exit 1; fi
            if [ ! -f "docs/releases/$version.md" ]; then echo "docs/releases/$version.md, the release notes, is not at the tagged commit"; exit 1; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not an ancestor of origin/main"; exit 1
          fi
      - name: CI passed for this commit
        run: |
          runs=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$runs" -lt 1 ]; then echo "ci.yml has no successful run for $GITHUB_SHA"; exit 1; fi

  build:
    name: PyPI package
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build
        env:
          PYTHON: python
        run: |
          python -m pip install --quiet build==1.6.1
          node packaging/pypi/build.mjs dist
      # SLSA build provenance for each file, signed through GitHub's OIDC identity and kept in the
      # repository's attestations: gh attestation verify <file> -R Portll/cobolwork
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi
          path: dist/

  # The npm tarball, packed once here; the GitHub release attaches it and the npm job publishes it.
  npm-pack:
    name: npm package
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Pack
        run: |
          mkdir out "$RUNNER_TEMP/again"
          npm pack --pack-destination out
          npm pack --pack-destination "$RUNNER_TEMP/again"
          node diag/release-artefacts.mjs same "out/portll-cobolwork-$VERSION.tgz" "$RUNNER_TEMP/again/portll-cobolwork-$VERSION.tgz"
          mv "out/portll-cobolwork-$VERSION.tgz" "out/cobolwork-$VERSION.tgz"
          cp "out/cobolwork-$VERSION.tgz" out/cobolwork.tgz
      - name: SBOM and SHA256SUMS
        run: |
          node diag/release-artefacts.mjs sbom "out/cobolwork-$VERSION.tgz" > "$RUNNER_TEMP/sbom.json"
          mv "$RUNNER_TEMP/sbom.json" "out/cobolwork-$VERSION.cdx.json"
          node diag/release-artefacts.mjs sums out/* > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" out/SHA256SUMS
          (cd out && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm
          path: out/

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [check, build, npm-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm
          path: out/
      - name: Create the release
        run: |
          gh release create "$TAG" "out/cobolwork-$VERSION.tgz" out/cobolwork.tgz \
            "out/cobolwork-$VERSION.cdx.json" out/SHA256SUMS --verify-tag \
            --title "cobolwork $VERSION" --notes-file "docs/releases/$VERSION.md"

  npm:
    name: publish to npm
    if: github.event_name == 'push'
    needs: [check, build, npm-pack, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm
          path: out/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.5.1 or later
        run: |
          npm install -g npm@^11.5.1
          npm --version
      # A path without ./ is read as a GitHub owner/repo shorthand and fetched with git.
      - name: Publish
        run: npm publish "./out/cobolwork-$VERSION.tgz" --access public

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: [check, build, npm-pack, release, npm]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # Moves the Action's v1 tag to this release's commit, for stable 1.x.y releases. A dispatch on an
  # earlier release's tag ref with action_v1 on and dry_run off moves it back. The environment's
  # reviewer approves each move; its deploy key is the only writer the ruleset on refs/tags/v1 allows.
  action-v1:
    name: move the Action's v1 tag
    if: >-
      always() && needs.check.result == 'success' && needs.build.result == 'success' && needs.npm-pack.result == 'success'
      && startsWith(needs.check.outputs.version, '1.') && !contains(needs.check.outputs.version, '-')
      && ((github.event_name == 'push' && needs.release.result == 'success' && needs.npm.result == 'success' && needs.pypi.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.action_v1 && !inputs.dry_run))
    needs: [check, build, npm-pack, release, npm, pypi]
    runs-on: ubuntu-latest
    environment: action-v1
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.ACTION_V1_DEPLOY_KEY }}
      - name: Move v1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git tag --force v1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1
          git ls-remote --tags origin refs/tags/v1 | grep -q "^$GITHUB_SHA"
