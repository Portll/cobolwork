name: cobolwork build gate
description: Run cobolwork's build gate over a COBOL, JCL and CICS repository and write its SARIF for code scanning.
author: Portll

inputs:
  path:
    description: Repository directory to judge, relative to the workspace.
    required: false
    default: '.'
  base:
    description: Revision the change is measured against. Empty judges the tree as it stands (absolute mode). Defaults to the pull request base commit.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  policy:
    description: An organisation policy file, from outside the repository being judged.
    required: false
    default: ''
  copylib:
    description: Directories of system copybooks the source includes, comma-separated.
    required: false
    default: ''
  version:
    description: npm version or tag of @portll/cobolwork to install, or 'local' to run the copy in this action's own checkout.
    required: false
    default: 'latest'
  sarif:
    description: Where to write the SARIF file, relative to the workspace.
    required: false
    default: 'cobolwork.sarif'
  fail-on:
    description: "'fail' fails the step on exit 1, 2 and 4; 'undecided' also fails it on exit 3."
    required: false
    default: 'fail'

outputs:
  verdict:
    description: The gate's verdict as printed on its summary line (pass, fail, undecided), or error when it could not run.
    value: ${{ steps.gate.outputs.verdict }}
  exit-code:
    description: The exit status of cobolwork build.
    value: ${{ steps.gate.outputs.exit-code }}
  sarif:
    description: The path the SARIF file was written to.
    value: ${{ steps.gate.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '26'

    - name: Install cobolwork
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
        TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        if [ "$INPUT_VERSION" = local ]; then
          echo "bin=$ACTION_PATH/bin/cobolwork.mjs" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$INPUT_VERSION" in
          ''|-*|*[!A-Za-z0-9._~^+-]*) echo "::error::version must be an npm version or tag, or 'local'"; exit 2 ;;
        esac
        prefix="$TEMP_DIR/cobolwork-npm"
        npm install --prefix "$prefix" --no-audit --no-fund --ignore-scripts "@portll/cobolwork@$INPUT_VERSION"
        echo "bin=$prefix/node_modules/@portll/cobolwork/bin/cobolwork.mjs" >> "$GITHUB_OUTPUT"

    - name: Run the build gate
      id: gate
      shell: bash
      env:
        COBOLWORK_BIN: ${{ steps.install.outputs.bin }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_COPYLIB: ${{ inputs.copylib }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        case "$INPUT_FAIL_ON" in
          fail|undecided) ;;
          *) echo "::error::fail-on must be 'fail' or 'undecided'"; exit 2 ;;
        esac
        case "$INPUT_PATH" in -*) echo "::error::path must not begin with a dash"; exit 2 ;; esac

        args=(build "$INPUT_PATH" --format sarif --out "$INPUT_SARIF")
        if [ -n "$INPUT_BASE" ]; then args+=(--base "$INPUT_BASE"); fi
        if [ -n "$INPUT_POLICY" ]; then args+=(--policy "$INPUT_POLICY"); fi
        if [ -n "$INPUT_COPYLIB" ]; then args+=(--copylib "$INPUT_COPYLIB"); fi

        err="$TEMP_DIR/cobolwork-build.stderr"
        code=0
        node "$COBOLWORK_BIN" "${args[@]}" 2> "$err" || code=$?
        cat "$err" >&2

        verdict=$(sed -n 's/^cobolwork build: \([a-z]*\).*/\1/p' "$err" | head -n 1)
        if [ -z "$verdict" ]; then verdict=error; fi
        {
          echo "verdict=$verdict"
          echo "exit-code=$code"
          echo "sarif=$INPUT_SARIF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### cobolwork build gate"
          echo
          echo '```'
          cat "$err"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        # Exit codes: 0 pass, 1 fail, 2 could not run, 3 undecided, 4 compiler failed.
        case "$code" in
          0) exit 0 ;;
          1|2|4) echo "::error::cobolwork build exited $code ($verdict)"; exit "$code" ;;
          3)
            if [ "$INPUT_FAIL_ON" = undecided ]; then
              echo "::error::cobolwork build is undecided (exit 3)"; exit 3
            fi
            echo "::warning::cobolwork build is undecided (exit 3)"
            exit 0 ;;
          *) echo "::error::cobolwork build exited $code"; exit "$code" ;;
        esac
