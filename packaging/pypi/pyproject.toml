[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cobolwork"
version = "0.0.0"
description = "COBOL, JCL and CICS security analysis: reference-format parser, cross-program data flow, mainframe credential rules. Runs on Node.js 22 or later."
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Portll", email = "john@portll.net" }]
keywords = ["cobol", "jcl", "cics", "mainframe", "sast", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Portll/cobolwork"
Source = "https://github.com/Portll/cobolwork"
Issues = "https://github.com/Portll/cobolwork/issues"

[project.scripts]
cobolwork = "cobolwork._launcher:main"

[tool.setuptools]
packages = ["cobolwork"]

[tool.setuptools.package-data]
cobolwork = ["node/**/*"]
