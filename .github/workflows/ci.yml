name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor package.json declares, 24 is current. On Windows, report paths must stay
        # POSIX-shaped and diff must undo git's line-ending conversion.
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '22' }
          - { os: windows-latest, node: '22' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # There is nothing to install. No runtime or development dependencies, so no lockfile and no
      # npm ci step; a CI run that needed one would mean a dependency had appeared.
      - name: Refuse any dependency
        shell: bash
        run: |
          # shellcheck disable=SC2016 # the ${} are JavaScript template literals
          node -e '
            const p = require("./package.json");
            const d = Object.keys({ ...p.dependencies, ...p.devDependencies, ...p.peerDependencies, ...p.optionalDependencies });
            for (const k of ["bundleDependencies", "bundledDependencies"]) d.push(...(p[k] === true ? [k] : p[k] || []));
            const n = d.length;
            if (n) { console.error(`cobolwork declares ${n} dependencies: ${d.join(", ")}`); process.exit(1); }
            console.log("no dependencies declared");
          '
      # Serial, because the memory guard reads the whole machine's free memory. The script passes
      # no glob: npm runs it through cmd on Windows, which would not expand one.
      - name: Test
        run: npm test

  # ironwork's run-endings table is vendored in test/fixtures/ironwork, and the message areas
  # cobolwork reads are in lib/ironwork-ids.mjs; this job compares both with ironwork's.
  ironwork-ids:
    name: ironwork's run endings and message areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Portll/ironwork
          # Pinned to ironwork 0.9.0, whose table the copy matches and whose areas cobolwork reads.
          ref: 9cdd030f630d900638fb5f2adf284780120ca0a5
          path: ironwork
          persist-credentials: false
          sparse-checkout: |
            docs/run-endings.tsv
            docs/messages.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Compare the vendored run endings and the message areas with ironwork's
        env:
          COBOLWORK_IRONWORK_DIR: ${{ github.workspace }}/ironwork
        run: node --test test/ironwork-ids.test.mjs

  scan-self:
    name: scan its own benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # The benchmark cases are deliberately flawed COBOL. A run that reported them clean, or that
      # reported incomplete coverage over them, would mean the tool had stopped reading.
      - name: Scan
        shell: bash
        run: |
          node bin/cobolwork.mjs scan bench/cases --quiet --out scan.json
          # shellcheck disable=SC2016 # the ${} are JavaScript template literals
          node -e '
            const s = require("./scan.json").summary;
            if (s.coverageIncomplete) { console.error("coverage incomplete over the benchmark"); process.exit(1); }
            if (!s.findings) { console.error("the benchmark reported clean"); process.exit(1); }
            console.log(`${s.findings} findings over ${s.filesScanned} files`);
          '
